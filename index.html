<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GMSL3 链路解剖</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(1120px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="light"><main class="iso-page"><style>.iso{--lk-glass:#2b2b30;--lk-picture:#e9e9e5;--lk-picture-ink:#2a2a2e;--lk-bar-pcb:#8a8a8f;--lk-bar-cable:#4a4a50;--lk-chip-bg:#f4f4f1;--lk-dim-hi:#9c9ca1;--lk-dim-mid:#bcbcc0;--lk-dim-lo:#d0d0d3;--lk-dim-faint:#e2e2e3}
.iso[data-theme="dark"]{--lk-glass:#0a0a0c;--lk-picture:#d2d2cc;--lk-picture-ink:#1a1a1c;--lk-bar-pcb:#8c8c92;--lk-bar-cable:#c4c4c8;--lk-chip-bg:#232327;--lk-dim-hi:#8a8a90;--lk-dim-mid:#66666c;--lk-dim-lo:#4c4c51;--lk-dim-faint:#38383c;
  /* 提亮深色主题：底色从近黑抬到深灰，线条和明暗面整体上调 */
  --anatomy-page:#16161a;--anatomy-card:#202024;--anatomy-text:#c4c4c8;--anatomy-strong:#f2f2f2;--anatomy-muted:#9a9aa0;
  --anatomy-paper:#202024;--anatomy-face:#34343a;--anatomy-top:#36363c;
  --anatomy-shade-0:#1d1d21;--anatomy-shade-1:#242428;--anatomy-shade-2:#2b2b30;--anatomy-shade-3:#313136;
  --anatomy-lit-top:#4a4a52;--anatomy-lit-shade:#3c3c43;
  --anatomy-hi:#ededed;--anatomy-mid:#a6a6ac;--anatomy-lo:#7c7c82;--anatomy-faint:#5a5a60;--anatomy-lit:#ffffff;
  --anatomy-halo:#000;--anatomy-halo-opacity:.75;--anatomy-dot:#f4f4f4}
.iso-page{margin-top:40px}
.lk-stage{outline:none;position:relative}
.lk-stage:focus-visible{box-shadow:0 0 0 1px var(--anatomy-mid)}

/* 板面走线 */
.lk-trace{stroke-width:.5}
.lk-wide{stroke-width:.85}

/* 测试卡与屏幕画面 */
.lk-chart-bg{fill:var(--anatomy-face);stroke:none}
.lk-ink{fill:var(--anatomy-hi);stroke:none;opacity:.82}
.lk-ring{fill:none;stroke:var(--anatomy-mid);stroke-width:.4;vector-effect:non-scaling-stroke}
.lk-screen{fill:var(--lk-glass);stroke:none}
.lk-screen-edge{fill:none;stroke:var(--anatomy-lo);stroke-width:.6;vector-effect:non-scaling-stroke}
.lk-picture .lk-chart-bg{fill:var(--lk-picture)}
.lk-picture .lk-ink{fill:var(--lk-picture-ink)}
.lk-picture{transition:opacity .25s var(--anatomy-ease)}
.lk-picture[data-flash]{opacity:.78}

/* 高亮：被选中的部件按 lit 规则画，其余退后 */
.lk-stage[data-sel] .lk-bench .it:not([data-on]){--anatomy-hi:var(--lk-dim-hi);--anatomy-mid:var(--lk-dim-mid);--anatomy-lo:var(--lk-dim-lo);--anatomy-faint:var(--lk-dim-faint);--anatomy-dot:var(--lk-dim-mid);--lk-picture-ink:var(--lk-dim-mid)}
.it[data-on] .iso-solid>.iso-edge,.it[data-on] .tb-edge{stroke:var(--anatomy-lit)}
.it[data-on] .iso-solid>.iso-fill{fill:var(--anatomy-face)}
.it[data-on] .iso-solid>.iso-top{fill:var(--anatomy-lit-top)}
.it[data-on] .iso-solid>.iso-shade{fill:var(--anatomy-lit-shade)}
.it[data-on] .lk-trace,.lk-sub[data-on] .lk-trace{stroke:var(--anatomy-lit);stroke-width:1.15}
.lk-sub[data-on] .iso-line:not(.lk-trace){stroke:var(--anatomy-lit)}
.it[data-on] .tb-body{fill:var(--anatomy-lit-shade)}
.it[data-on] .tb-shine{fill:var(--anatomy-lit-top)}

/* 信号点 */
.lk-pkt{fill:var(--anatomy-lit);stroke:var(--anatomy-card);stroke-width:.5;vector-effect:non-scaling-stroke}
.lk-rev{fill:var(--anatomy-card);stroke:var(--anatomy-hi);stroke-width:.8;vector-effect:non-scaling-stroke}
.lk-poc{fill:none;stroke:var(--anatomy-hi);stroke-width:1.1;stroke-dasharray:1.2 5;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.75;animation:lk-poc 2.4s linear infinite}
@keyframes lk-poc{to{stroke-dashoffset:-37.2}}
.lk-hitline{fill:none;stroke:transparent;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke}
[data-part="packets"],[data-part="poc"]{pointer-events:none}
.lk-pin{font-size:12px;color:var(--anatomy-muted)}
.lk-bench [data-seg]{cursor:pointer}
@media (prefers-reduced-motion:reduce){.lk-poc{animation:none}}

/* 说明面板 */
.lk-panel{margin:-8px 0 0;display:grid;gap:14px;color:var(--anatomy-text);font-size:14px;line-height:1.6}
.lk-controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.lk-group{display:inline-flex;gap:0;box-shadow:0 0 0 1px var(--anatomy-lo)}
.lk-group button,.lk-chip{appearance:none;border:0;background:transparent;color:var(--anatomy-text);font:inherit;font-size:12.5px;padding:6px 12px;cursor:pointer;line-height:1.3}
.lk-group button+button{box-shadow:-1px 0 0 var(--anatomy-lo)}
.lk-group button[aria-pressed="true"]{background:var(--anatomy-strong);color:var(--anatomy-card)}
.lk-group button:focus-visible,.lk-chip:focus-visible{outline:1px dashed var(--anatomy-muted);outline-offset:3px}
.lk-chain{display:flex;flex-wrap:wrap;gap:6px}
.lk-chip{display:inline-flex;align-items:baseline;gap:6px;box-shadow:0 0 0 1px var(--anatomy-lo);background:var(--lk-chip-bg)}
.lk-chip[data-kind="sub"]{font-size:12px;padding:5px 10px;opacity:.92}
.lk-chip[data-on]{background:var(--anatomy-strong);color:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-strong)}
.lk-chip[data-on] .lk-num{color:var(--anatomy-card);opacity:.7}
.lk-num{font-family:var(--anatomy-mono);font-size:11px;color:var(--anatomy-muted)}
.lk-detail{display:grid;gap:10px;padding:18px 20px;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-lo);min-height:220px}
.lk-detail h2{margin:0;font-size:17px;color:var(--anatomy-strong);font-weight:600;display:flex;gap:10px;align-items:baseline}
.lk-detail h2 .lk-num{font-size:12px}
.lk-detail p{margin:0}
.lk-io{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}
.lk-io dt{color:var(--anatomy-muted)}
.lk-io dd{margin:0}
.lk-tbd{color:var(--anatomy-strong);font-weight:600}
.lk-si{margin:0;padding-left:1.2em;display:grid;gap:4px}
.lk-si-title{font-size:12px;letter-spacing:.08em;color:var(--anatomy-muted);margin-top:4px}
.lk-budget{display:grid;gap:10px;padding:16px 20px;box-shadow:0 0 0 1px var(--anatomy-lo)}
.lk-budget h3{margin:0;font-size:13px;font-weight:600;color:var(--anatomy-strong)}
.lk-row{display:grid;grid-template-columns:120px 1fr 92px;gap:12px;align-items:center;font-variant-numeric:tabular-nums;font-size:12.5px}
.lk-bar{position:relative;height:18px;display:flex;background:transparent;box-shadow:inset 0 0 0 1px var(--anatomy-faint)}
.lk-bar span{height:100%;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--anatomy-card);overflow:hidden;white-space:nowrap;transition:width .4s var(--anatomy-ease),opacity .3s}
.lk-bar span+span{box-shadow:-1px 0 0 var(--anatomy-card)}
.lk-bar [data-k="pcb"]{background:var(--lk-bar-pcb)}
.lk-bar [data-k="cable"]{background:var(--lk-bar-cable)}
.lk-bar[data-dim] span:not([data-on]){opacity:.35}
.lk-limit{position:absolute;top:-4px;bottom:-4px;width:0;border-left:1.5px solid var(--anatomy-strong)}
.lk-note{font-size:12px;color:var(--anatomy-muted)}
@media (max-width:640px){
  .lk-stage{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .lk-stage>svg{width:820px;max-width:none}
  .lk-row{grid-template-columns:64px 1fr 58px;font-size:11.5px}
  .iso-plate-corner[data-corner="readout"]{white-space:normal;left:0;text-align:right;line-height:1.35}
  .lk-stage::after{content:"← 左右滑动看全图 →";display:block;text-align:center;font-size:11px;color:var(--anatomy-muted);position:sticky;left:0;padding-top:4px}
}

/* 页脚导航与赞赏码 */
.lk-nav{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:22px;font-size:12.5px}
.lk-nav a{color:var(--anatomy-muted);text-decoration:none;border-bottom:1px solid var(--anatomy-faint)}
.lk-nav a:hover{color:var(--anatomy-strong)}
.lk-nav a[aria-current]{color:var(--anatomy-strong);border-bottom-color:var(--anatomy-strong)}
.lk-reward-btn{position:fixed;right:18px;bottom:18px;z-index:20;appearance:none;border:0;background:var(--anatomy-card);color:var(--anatomy-text);font:inherit;font-size:13px;padding:8px 14px;cursor:pointer;box-shadow:0 0 0 1px var(--anatomy-lo),0 4px 14px rgba(0,0,0,.12)}
.lk-reward-btn:hover{color:var(--anatomy-strong)}
.lk-reward{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(0,0,0,.45);padding:16px}
.lk-reward[hidden]{display:none}
.lk-reward-card{background:#fff;color:#222;padding:20px 20px 16px;display:grid;gap:10px;justify-items:center;max-width:min(320px,100%);box-shadow:0 10px 40px rgba(0,0,0,.3)}
.lk-reward-card img{width:min(280px,72vw);height:auto;display:block}

const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);

  const cum = [0];
  for (let i = 1; i < points.length; i++) cum.push(cum[i - 1] + Math.hypot(points[i][0] - points[i - 1][0], points[i][1] - points[i - 1][1]));
  return { points, cum, len: cum[cum.length - 1] };
}
function pointAt(p, s) {
  const t = Math.max(0, Math.min(p.len, s));
  let i = 1;
  while (i < p.cum.length - 1 && p.cum[i] < t) i++;
  const span = p.cum[i] - p.cum[i - 1] || 1;
  const f = (t - p.cum[i - 1]) / span;
  const a = p.points[i - 1];
  const b = p.points[i];
  return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
}
const PATH = Object.fromEntries(Object.entries(D.paths).map(([id, pts]) => [id, poly(pts)]));
const FWD = ["cam", "ser1", "a1", "ca", "a2", "des1", "soc", "ser2", "b1", "cb", "b2", "des2", "disp"];
const DUR = { cam: 0.55, ser1: 0.35, a1: 0.45, ca: 1.7, a2: 0.45, des1: 0.45, soc: 0.9, ser2: 0.35, b1: 0.45, cb: 1.7, b2: 0.45, des2: 0.35, disp: 0.75 };
const START = {};
let total = 0;
for (const id of FWD) { START[id] = total; total += DUR[id]; }

// ---------- 状态 ----------
let long = false;
let showRev = true;
let showPoc = true;
let running = !still.matches;
let selected = null;
let touring = true;
let tourClock = 0;
let tourIndex = 0;
let idleTimer = 0;

// 每段的插损分配（dB），来自 model：PCB / 线缆 / PCB
function lossOf(id) {
  const b = budget(long);
  if (id === "a1" || id === "a2" || id === "b1" || id === "b2") return b.pcb;
  if (id === "ca" || id === "cb") return b.cable;
  return 0;
}
// 前向点在路径上某处时的 3 GHz 分量幅度
function ampAt(id, f) {
  const b = budget(long);
  const chan = { a1: 0, ca: b.pcb, a2: b.pcb + b.cable, b1: 0, cb: b.pcb, b2: b.pcb + b.cable };
  if (id in chan) return amp(chan[id] + lossOf(id) * f);
  if (id === "des1" || id === "des2") {
    const end = amp(b.total);
    const g = Math.min(1, f / 0.7);
    return end + (1 - end) * g * g * (3 - 2 * g);
  }
  return 1;
}

// ---------- 信号点 ----------
const pool = [];
function dot(i, cls) {
  if (!pool[i]) {
    const c = document.createElementNS(NS, "circle");
    layer.appendChild(c);
    pool[i] = c;
  }
  const c = pool[i];
  if (c.getAttribute("class") !== cls) c.setAttribute("class", cls);
  return c;
}
const EMIT = 0.62;
const REV_EMIT = 1.7;
const REV_DUR = 3.4;
const REV = {
  chA: poly([...PATH.a2.points].reverse().concat([...PATH.ca.points].reverse(), [...PATH.a1.points].reverse())),
  chB: poly([...PATH.b2.points].reverse().concat([...PATH.cb.points].reverse(), [...PATH.b1.points].reverse())),
};
let clock = 0;
function drawPackets() {
  let n = 0;
  const first = Math.floor((clock - total) / EMIT) + 1;
  const last = Math.floor(clock / EMIT);
  for (let k = Math.max(0, first); k <= last; k++) {
    const age = clock - k * EMIT;
    if (age < 0 || age > total) continue;
    let id = FWD[0];
    for (const s of FWD) if (age >= START[s]) id = s;
    const f = (age - START[id]) / DUR[id];
    const p = pointAt(PATH[id], f * PATH[id].len);
    const a = ampAt(id, f);
    const c = dot(n++, "lk-pkt");
    c.setAttribute("cx", p[0].toFixed(1));
    c.setAttribute("cy", p[1].toFixed(1));
    c.setAttribute("r", (0.8 + 2.3 * a).toFixed(2));
    c.setAttribute("fill-opacity", (0.45 + 0.55 * a).toFixed(2));
    if (id === "disp" && f > 0.92 && picture) flash();
  }
  if (showRev) {
    for (const [ch, path] of Object.entries(REV)) {
      const lastR = Math.floor(clock / REV_EMIT);
      for (let k = Math.max(0, lastR - 3); k <= lastR; k++) {
        const age = clock - k * REV_EMIT - (ch === "chB" ? 0.6 : 0);
        if (age < 0 || age > REV_DUR) continue;
        const p = pointAt(path, (age / REV_DUR) * path.len);
        const c = dot(n++, "lk-rev");
        c.setAttribute("cx", p[0].toFixed(1));
        c.setAttribute("cy", p[1].toFixed(1));
        c.setAttribute("r", "1.25");
        c.removeAttribute("fill-opacity");
      }
    }
  }
  for (let i = n; i < pool.length; i++) if (pool[i].getAttribute("r") !== "0") pool[i].setAttribute("r", "0");
}
let flashUntil = 0;
function flash() {
  if (performance.now() < flashUntil) return;
  flashUntil = performance.now() + 260;
  picture.setAttribute("data-flash", "");
  setTimeout(() => picture.removeAttribute("data-flash"), 130);
}

// PoC：ECU 的 PoC 电感 → 线缆 → 摄像头板
function drawPoc() {
  pocLayer.innerHTML = "";
  if (!showPoc) return;
  const pts = [...PATH.a2.points].reverse().slice(1).concat([...PATH.ca.points].reverse(), [...PATH.a1.points].reverse().slice(0, 2));
  const p = document.createElementNS(NS, "path");
  p.setAttribute("class", "lk-poc");
  p.setAttribute("d", "M" + pts.map((q) => q[0].toFixed(1) + " " + q[1].toFixed(1)).join("L"));
  pocLayer.appendChild(p);
}

// ---------- 选择与说明 ----------
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const mark = (s) => esc(s).replace(/^待定/, '<span class="lk-tbd">待定</span>');
function shortLine(s) {
  const b = budget(long);
  const mode = long ? "长" : "短";
  if (s.il === "pcb") return `${s.num} ${s.name} · 插损 ≤ ${fmt(b.pcb)} dB @ 3 GHz`;
  if (s.il === "cable") return `${s.num} ${s.name} · 插损 ≤ ${fmt(b.cable)} dB @ 3 GHz（${mode}线）`;
  if (s.kind === "channel") return `${s.num} ${s.name} · 插损 ≤ ${fmt(b.limit, 0)} dB @ 3 GHz（${mode}通道）`;
  if (/^(ser|des)/.test(s.id)) return `${s.num} ${s.name} · 前向 12 Gbps PAM4 / 反向 187.5 Mbps`;
  return `${s.num} ${s.name}`;
}
function renderDetail(id) {
  const s = SEG[id ?? "chA"];
  const io = s.io.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${mark(v)}</dd>`).join("");
  const si = s.si.map((x) => `<li>${esc(x)}</li>`).join("");
  const parent = s.parent ? ` · 属于 ${esc(SEG[s.parent].num)} ${esc(SEG[s.parent].name)}` : "";
  detail.innerHTML = `<h2><span class="lk-num">${esc(s.num)}</span>${esc(s.name)}<span class="lk-note">${parent}</span>${pinned === id ? '<span class="lk-pin">· 已固定，点图中空白处或按 Esc 取消</span>' : ""}</h2><p>${esc(s.func)}</p><dl class="lk-io">${io}</dl><div class="lk-si-title">信号完整性关注点</div><ul class="lk-si">${si}</ul>`;
}
function renderBudget() {
  const b = budget(long);
  const scale = 20;
  const pct = (v) => ((v / scale) * 100).toFixed(2) + "%";
  const on = (k) => (selected === k || SEG[selected]?.parts?.includes(k) ? " data-on" : "");
  const dim = (ch) => (selected && (CHANNEL[selected] === ch || selected === ch) ? " data-dim" : "");
  const row = (ch, label, ids) => `<div class="lk-row"><span>${label}</span><span class="lk-bar"${dim(ch)}><span data-k="pcb"${on(ids[0])} style="width:${pct(b.pcb)}">${fmt(b.pcb)}</span><span data-k="cable"${on(ids[1])} style="width:${pct(b.cable)}">线缆 ${fmt(b.cable)}</span><span data-k="pcb"${on(ids[2])} style="width:${pct(b.pcb)}">${fmt(b.pcb)}</span><i class="lk-limit" style="left:${pct(b.limit)}"></i></span><span>${fmt(b.total)} / ${fmt(b.limit, 0)} dB</span></div>`;
  budgetBox.innerHTML = `<h3>插损预算 @ 3 GHz（${long ? "长" : "短"}通道，标尺 0–20 dB，竖线 = pin-to-pin 上限）</h3>${row("chA", "通道 A 3a·3b·3c", ["a1", "ca", "a2"])}${row("chB", "通道 B 7a·7b·7c", ["b1", "cb", "b2"])}<div class="lk-note">3 GHz 分量到达解串器时剩 ${fmt(amp(b.total) * 100, 1)}% 幅度；反向 93.75 MHz 处 pin-to-pin 上限只有 ${fmt(long ? D.rev.long : D.rev.short)} dB（Table 3）。两跳各自独立，不相加。</div>`;
}
function select(id, { from = "user" } = {}) {
  selected = id;
  const ids = id ? (SEG[id].parts ?? [id]) : [];
  svg.querySelectorAll("[data-on]").forEach((el) => el.removeAttribute("data-on"));
  for (const x of ids) svg.querySelectorAll(`.lk-bench [data-seg="${x}"]`).forEach((el) => el.setAttribute("data-on", ""));
  if (id) stage.setAttribute("data-sel", id); else stage.removeAttribute("data-sel");
  document.querySelectorAll(".lk-chip").forEach((b) => b.toggleAttribute("data-on", b.dataset.pick === id));
  readout.textContent = id ? shortLine(SEG[id]) : "";
  renderDetail(id);
  renderBudget();
  if (from === "user") holdTour();
}
function holdTour() {
  touring = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (inside || pinned) return; touring = true; tourClock = 0; kick(); }, 9000);
}

// ---------- 交互 ----------
// 悬停 = 预览（停留 90 ms 才切换，划过不算）；点击 = 固定，固定后悬停不再改说明，点空白处或 Esc 取消
let pinned = null;
let hoverTimer = 0;
let inside = false;
const segAt = (e) => e.target.closest && e.target.closest("[data-seg]");
stage.addEventListener("pointermove", (e) => {
  inside = true;
  holdTour();
  if (pinned) return;
  const el = segAt(e);
  const id = el ? el.dataset.seg : null;
  clearTimeout(hoverTimer);
  if (id && id !== selected) hoverTimer = setTimeout(() => select(id), 90);
});
stage.addEventListener("pointerleave", () => { inside = false; clearTimeout(hoverTimer); holdTour(); });
stage.addEventListener("click", (e) => {
  const el = segAt(e);
  if (el) { pinned = el.dataset.seg; select(pinned); }
  else { pinned = null; select(selected); }
  stage.focus({ preventScroll: true });
});
document.querySelectorAll(".lk-chip").forEach((b) => b.addEventListener("click", () => { pinned = b.dataset.pick; select(pinned); }));
function setMode(next) {
  long = next;
  document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.mode === "long") === long)));
  select(selected, { from: "mode" });
}
document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { setMode(b.dataset.mode === "long"); holdTour(); }));
document.querySelectorAll("[data-toggle]").forEach((b) => b.addEventListener("click", () => {
  const on = b.getAttribute("aria-pressed") !== "true";
  b.setAttribute("aria-pressed", String(on));
  if (b.dataset.toggle === "rev") showRev = on;
  if (b.dataset.toggle === "poc") { showPoc = on; drawPoc(); }
  if (b.dataset.toggle === "run") { running = on; kick(); }
  drawPackets();
  holdTour();
}));
// 键盘：整页都响应（不必先点图）；按 code 判断，中文输入法下 L 也有效
document.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const onButton = e.target instanceof HTMLButtonElement;
  const i = ORDER.indexOf(selected);
  let handled = true;
  if (e.key === "ArrowRight" || e.key === "ArrowDown") pinned = ORDER[(i + 1) % ORDER.length];
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") pinned = ORDER[(i - 1 + ORDER.length) % ORDER.length];
  else if (e.code === "KeyL") { setMode(!long); holdTour(); }
  else if (e.code === "Space" && !onButton) document.querySelector('[data-toggle="run"]').click();
  else if (e.key === "Escape") { pinned = null; select(null); }
  else handled = false;
  if (!handled) return;
  e.preventDefault();
  if (/^Arrow/.test(e.key)) {
    select(pinned);
    // 焦点跟着选中项走：焦点框和选中高亮永远落在同一个按钮上
    if (document.activeElement instanceof HTMLButtonElement) document.querySelector(`.lk-chip[data-pick="${pinned}"]`)?.focus({ preventScroll: true });
  }
});

// ---------- 主循环 ----------
let frame = 0;
let lastT = 0;
let visible = false;
const TOUR = ["chA", "a1", "ca", "a2", "des1", "soc", "ser2", "chB", "cb", "des2", "disp", "cam", "ser1"];
function tick(now) {
  const dt = lastT ? Math.min((now - lastT) / 1000, 1 / 20) : 1 / 60;
  lastT = now;
  if (running) clock += dt;
  if (touring && !still.matches) {
    tourClock += dt;
    if (tourClock > 4.2) { tourClock = 0; tourIndex = (tourIndex + 1) % TOUR.length; select(TOUR[tourIndex], { from: "tour" }); }
  }
  drawPackets();
  frame = visible && (running || touring) ? requestAnimationFrame(tick) : 0;
}
function kick() { if (!frame && visible) { lastT = 0; frame = requestAnimationFrame(tick); } }
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) kick(); }, { rootMargin: "120px 0px" }).observe(stage);
if (still.matches) { running = false; touring = false; clock = 3.1; document.querySelector('[data-toggle="run"]').setAttribute("aria-pressed", "false"); }
drawPoc();
select(TOUR[0], { from: "tour" });
drawPackets();

// ---------- 赞赏码 ----------
const rewardBox = document.querySelector("[data-reward-box]");
const rewardBtn = document.querySelector("[data-reward]");
const closeReward = () => { rewardBox.hidden = true; rewardBtn.focus({ preventScroll: true }); };
rewardBtn.addEventListener("click", () => { rewardBox.hidden = false; rewardBox.querySelector("[data-reward-close]").focus(); });
rewardBox.addEventListener("click", (e) => { if (e.target === rewardBox || e.target.closest("[data-reward-close]")) closeReward(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !rewardBox.hidden) closeReward(); });
</script></body></html>
